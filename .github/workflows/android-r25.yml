name: Android R25 actual UI preconditions
on:
  push:
    paths: ['android/app/**', 'android/tools/*r25*', '.github/workflows/android-r25.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  readiness:
    name: Focused actual platform R25 UI readiness (not full acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install actual pinned compilation platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
          python3 tools/record_sdk_platform.py --report installed-sdk37.json
      - name: Enable actual KVM execution
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real asleep-precondition counterexample and retained input scenarios
        run: >
          bash tools/run_gradle_ci.sh device :app:pixel6Api34ProDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.fusionDisposable=true
          -Pandroid.experimental.enableAdditionalTestOutput=true
          '-Pandroid.testInstrumentationRunnerArguments.class=dev.fusion.shell.R25UiReadinessDeviceTest,dev.fusion.shell.R24TaskInputDeviceTest,dev.fusion.shell.RealImeDeviceTest,dev.fusion.shell.ShellSmokeTest#editorActionsRemainVisibleAfterLongInputAtTwoHundredPercentFont'
      - name: Actual named outcomes
        if: always()
        run: python3 tools/report_device_results.py
      - name: Actual prepared UI observations, not a behavior pass
        if: always()
        run: python3 tools/r25_ui_lab.py --require-observed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r25-ui-preconditions
          path: |
            android/device.log
            android/device-results.json
            android/r25-ui-readiness.json
            android/app/build/outputs/androidTest-results/**
            android/app/build/outputs/managed_device_android_test_additional_output/**
