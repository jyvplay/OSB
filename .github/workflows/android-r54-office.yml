name: R54 office authoring
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-r54-office.yml']
  push:
    paths: ['android/**', '.github/workflows/android-r54-office.yml']
  workflow_dispatch:
concurrency:
  group: r54-office-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  office:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the emulator's Linux host audio library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          ldconfig -p | grep -F 'libpulse.so.0'
      - name: Install and check Android platform and managed-emulator components
        run: bash tools/install_r54_sdk.sh
      - name: Prepare independently constructed R73 formula fixtures
        run: python3 tools/r73_formula_cases.py build testing/build/r73formula
      - name: Compile Android and run actual JVM contracts
        run: bash tools/run_gradle_ci.sh assemble :app:assembleProDebug :app:assembleProDebugAndroidTest :testing:r54Contracts :testing:r55Contracts :testing:r56Contracts :testing:r57Contracts :testing:r58Contracts :testing:r59Contracts :testing:r59WriterContracts :testing:r60WriterContracts :testing:r60SheetContracts :testing:r61SheetContracts :testing:r62RangeContracts :testing:r62WriterContracts :testing:r63FormulaFillContracts :testing:r63WriterRestartContracts :testing:r64SheetCopyContracts :testing:r64WriterTableContracts :testing:r64SheetCsvContracts :testing:r72OfficeZipSeed :testing:r72OoxmlZipSeed :testing:r72WriterBoundaries :testing:r73FormulaContracts
      - name: Prepare independently constructed Office ZIP boundary fixtures
        run: python3 tools/r72_office_zip_cases.py testing/build/r72zip
      - name: Run real Office ZIP readers over those fixtures
        run: bash tools/run_gradle_ci.sh contracts :testing:r72OfficeZipContracts
      - name: Prepare independently constructed import-budget fixtures
        run: python3 tools/r72_ooxml_zip_cases.py build testing/build/r72ooxml
      - name: Run the production import extractor over those fixtures
        run: bash tools/run_gradle_ci.sh contracts :testing:r72OoxmlZipContracts
      - name: Independent document readers and formula comparison (host-only, not bundled)
        run: |
          python3 -m pip install --user openpyxl==3.1.5 python-docx==1.2.0 formualizer==0.13.0
          python3 tools/check_r54_reference.py --require-office-libraries
          python3 tools/check_r55_reference.py --require-reference
          python3 tools/check_r56_reference.py --require-reference
          python3 tools/check_r57_reference.py
          python3 tools/check_r58_reference.py
          python3 tools/check_r59_reference.py
          python3 tools/check_r59_writer_reference.py
          python3 tools/check_r60_writer_reference.py
          python3 tools/check_r60_sheet_reference.py
          python3 tools/check_r61_sheet_reference.py
          python3 tools/check_r62_range_reference.py
          python3 tools/check_r62_writer_reference.py
          python3 tools/check_r63_formula_reference.py
          python3 tools/check_r63_writer_reference.py
          python3 tools/check_r64_sheet_copy_reference.py
          python3 tools/check_r64_formula_caches.py
          python3 tools/check_r64_writer_reference.py
          python3 tools/check_r64_csv_reference.py
          python3 tools/check_r72_office_zip_reference.py testing/build/r72zip
          python3 tools/r72_ooxml_zip_cases.py verify testing/build/r72ooxml
          python3 tools/r73_formula_cases.py verify testing/build/r73formula
          python3 tools/check_r73_formula_reference.py testing/build/r73formula --require-reference
          PYTHONPATH=tools python3 -m unittest test_r56_reference test_r57_reference test_r58_reference test_r59_reference test_r59_writer_reference test_r60_writer_reference test_r60_sheet_reference test_r61_sheet_reference test_r62_range_reference test_r62_writer_reference test_r63_formula_reference test_r63_writer_reference test_r64_sheet_reference test_r64_formula_caches test_r64_writer_reference test_r64_csv_reference test_r64_office_case_gate test_r64_runners test_r64_integration_contracts test_r72_office_zip test_r72_ooxml_zip test_r72_writer_guard test_r72_core_zip test_r73_formula_contract -v
      - name: Prepare real workbooks for the shared bounded ZIP reader
        run: python3 tools/r72_core_zip_cases.py build testing/build/r72core
      - name: Run four core readers over those workbooks
        run: bash tools/run_gradle_ci.sh contracts :testing:r72CoreZipContracts
      - name: Compare those readers against the pinned outcomes
        run: python3 tools/r72_core_zip_cases.py verify testing/build/r72core
      - name: Enable KVM for the disposable managed emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real API34 UI and provider checks
        run: >
          bash tools/run_gradle_ci.sh device :app:pixel6Api34ProDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.fusionDisposable=true
          -Pandroid.testInstrumentationRunnerArguments.class=dev.fusion.shell.R54OfficeDeviceTest,dev.fusion.shell.CopyContractDeviceTest,dev.fusion.shell.NativeVisualEvidenceDeviceTest,dev.fusion.shell.R58SheetDeviceTest,dev.fusion.shell.R59SheetDeviceTest,dev.fusion.shell.R24MapAndServiceDeviceTest,dev.fusion.shell.ShellSmokeTest#explicitLocalPlanOpensActualCalculatorAndPreservesModuleGates
          -Pandroid.experimental.enableAdditionalTestOutput=true
      - name: Publish actual device cases
        if: always()
        run: python3 tools/report_device_results.py --mode cases
      - name: Require all 37 named Office cases without duplicate or skip
        if: always()
        run: python3 tools/r64_office_case_gate.py
      - name: Publish bounded device failure details
        if: always()
        run: python3 tools/report_device_results.py --mode failures
      - name: Upload actual diagnostics, reports and native captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r54-office-evidence
          if-no-files-found: ignore
          path: |
            android/assemble.log
            android/device.log
            android/device-results.json
            android/sdk-setup.log
            android/app/build/reports/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/outputs/managed_device_android_test_additional_output/**
            android/testing/build/r54/artifacts/**
            android/testing/build/r55/artifacts/**
            android/testing/build/r56/artifacts/**
            android/testing/build/r57/artifacts/**
            android/testing/build/r58/artifacts/**
            android/testing/build/r59/artifacts/**
            android/testing/build/r59writer/artifacts/**
            android/testing/build/r60writer/artifacts/**
            android/testing/build/r60sheet/artifacts/**
            android/testing/build/r61sheet/artifacts/**
            android/testing/build/r62sheet/artifacts/**
            android/testing/build/r62writer/artifacts/**
            android/testing/build/r63sheet/artifacts/**
            android/testing/build/r63writer/artifacts/**
            android/testing/build/r64sheet/artifacts/**
            android/testing/build/r64writer/artifacts/**
            android/testing/build/r64csv/artifacts/**
      - name: Upload evaluation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r54-pro-debug-apk
          path: android/app/build/outputs/apk/pro/debug/*.apk
          if-no-files-found: error
  frames:
    name: Actual frame ${{ matrix.image }} (not all-page acceptance)
    needs: office
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [r24c-sheet.png, r24c-writer.png, r24c-round.png, r24c-structured.png, r58-text-grid.png, r58-service-review.png, r59-typed-grid.png, r60-writer-numbered.png, r60-sheet-transpose.png, r61-sheet-protection.png, r62-writer-strike.png, r62-sheet-range.png, r63-sheet-formula.png, r63-writer-restart.png, r64-sheet-copy.png, r64-sheet-csv.png, r64-writer-table.png]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r54-office-evidence
          path: android/app/build/outputs/managed_device_android_test_additional_output/transport
      - name: Native frame metadata
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(0,n,{n},require_complete=True)'
      - name: Native frame chunks 1
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(1,n,{n})'
      - name: Native frame chunks 2
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(2,n,{n})'
      - name: Native frame chunks 3
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(3,n,{n})'
      - name: Native frame chunks 4
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(4,n,{n})'
      - name: Native frame chunks 5
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(5,n,{n})'
      - name: Native frame chunks 6
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(6,n,{n})'
