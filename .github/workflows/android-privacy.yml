name: Android offline privacy companion
on:
  push:
    paths: ['android/privacy/**', 'android/core/security/**', 'android/tools/*r20*', '.github/workflows/android-privacy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    name: API34 privacy companion (not anonymity acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile, lint and execute actual companion
        run: bash tools/run_gradle_ci.sh device :privacy:assembleDebug :privacy:lintDebug :privacy:pixel6Api34DebugAndroidTest
      - name: Publish named actual outcomes
        if: always()
        run: python3 tools/report_device_results.py --root privacy/build/outputs/androidTest-results/managedDevice
      - name: Record APK footprint
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          files=list(Path('privacy/build/outputs/apk/debug').glob('*.apk'))
          if files:
            data=[{'file':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]
            Path('privacy-apk.json').write_text(json.dumps(data,indent=2))
            print('::notice::Privacy APK footprint (compressed APK only, not RAM/installed size/Tails comparison): '+json.dumps(data))
          else: print('::notice::No privacy APK built; no footprint inferred.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-privacy-companion
          path: |
            android/privacy/build/outputs/apk/debug/*.apk
            android/privacy/build/reports/**
            android/privacy/build/outputs/androidTest-results/**
            android/device.log
            android/privacy-apk.json
            android/device-results.json
