name: Android offline privacy companion
on:
  push:
    paths: ['android/app/**', 'android/core/designsystem/**', 'android/core/settings/**', 'android/core/windowing/**', 'android/feature/settings/**', 'android/tools/*r24*', 'android/gradle/**', 'android/gradle.properties', 'android/privacy/**', 'android/format/pdf/**', 'android/feature/automation/**', 'android/core/security/**', 'android/tools/*r20*', 'android/tools/*r23*', 'android/testing/src/r23/**', '.github/workflows/android-privacy.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  privacy:
    name: API34 privacy companion (not anonymity acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install and inspect actual SDK37.0 compilation platform (not runtime37)
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDK_MANAGER" ]]; then SDK_MANAGER="$(command -v sdkmanager)"; fi
          if "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' > sdk37-install.log 2>&1; then
            cat sdk37-install.log
          else
            result=$?;cat sdk37-install.log
            python3 tools/ci_annotations.py sdk37-install.log sdk37-install
            exit "$result"
          fi
          python3 tools/record_sdk_platform.py --report installed-sdk37.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile, lint and execute actual companion
        run: bash tools/run_gradle_ci.sh device :testing:r23Contracts :privacy:assembleDebug :privacy:lintDebug :privacy:pixel6Api34DebugAndroidTest
      - name: Publish named actual outcomes
        if: always()
        run: python3 tools/report_device_results.py --root privacy/build/outputs/androidTest-results/managedDevice
      - name: Record APK footprint
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          files=list(Path('privacy/build/outputs/apk/debug').glob('*.apk'))
          if files:
            data=[{'file':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]
            Path('privacy-apk.json').write_text(json.dumps(data,indent=2))
            print('::notice::Privacy APK footprint (compressed APK only, not RAM/installed size/Tails comparison): '+json.dumps(data))
          else: print('::notice::No privacy APK built; no footprint inferred.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-privacy-companion
          path: |
            android/privacy/build/outputs/apk/debug/*.apk
            android/privacy/build/reports/**
            android/privacy/build/outputs/androidTest-results/**
            android/device.log
            android/privacy-apk.json
            android/device-results.json
