name: Android R24 appearance, input and PDF boundaries
on:
  push:
    paths: ['android/app/**', 'android/core/designsystem/**', 'android/core/settings/**', 'android/core/windowing/**', 'android/feature/settings/**', 'android/feature/automation/**', 'android/tools/*r24*', 'android/gradle/**', 'android/gradle.properties', '.github/workflows/android-r24.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-ui:
    name: Focused actual R24 appearance and task inputs (not full-suite acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install and inspect actual SDK37.0 compilation platform (not runtime37)
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDK_MANAGER" ]]; then SDK_MANAGER="$(command -v sdkmanager)"; fi
          if "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' > sdk37-install.log 2>&1; then
            cat sdk37-install.log
          else
            result=$?;cat sdk37-install.log
            python3 tools/ci_annotations.py sdk37-install.log sdk37-install
            exit "$result"
          fi
          python3 tools/record_sdk_platform.py --report installed-sdk37.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute actual R24 appearance, task input and PDF boundaries
        run: >
          bash tools/run_gradle_ci.sh device :app:pixel6Api34ProDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.fusionDisposable=true
          -Pandroid.testInstrumentationRunnerArguments.class=dev.fusion.shell.R24AppearanceDeviceTest,dev.fusion.shell.R24TaskInputDeviceTest,dev.fusion.shell.R18TaskUiDeviceTest
      - name: Publish actual outcomes and diagnostics
        if: always()
        run: python3 tools/report_device_results.py
      - name: Publish bounded actual native screenshots, if exported by the device
        if: always()
        run: python3 tools/export_r24_captures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r24-native-device-reports
          path: |
            android/device.log
            android/device-results.json
            android/app/build/outputs/androidTest-results/**
            android/app/build/outputs/managed_device_android_test_additional_output/**
