name: Android R26 complete modules, attacks and visual captures
on:
  push:
    paths: ['android/**', '.github/workflows/android-r26.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  r26:
    name: Focused actual platform R26 suite and Gate-I attacks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Actual compilation platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
          python3 tools/record_sdk_platform.py --report installed-sdk37.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run R26 contracts and all 6 new module JVM tests
        run: >
          bash tools/run_gradle_ci.sh contracts
          :testing:r25PngContracts :testing:r26Contracts
          :core:fileops:test :format:poi:test
          :feature:office:testDebugUnitTest :feature:quickpanel:testDebugUnitTest
          :feature:photos:testDebugUnitTest :feature:ime:testDebugUnitTest
      - name: Execute R26 native integration, attacks and PixelCopy captures
        run: >
          bash tools/run_gradle_ci.sh device :app:pixel6Api34ProDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.fusionDisposable=true
          -Pandroid.experimental.enableAdditionalTestOutput=true
          -Pandroid.testInstrumentationRunnerArguments.class=dev.fusion.shell.R26IntegrationAndAttackDeviceTest
      - name: Actual named outcomes
        if: always()
        run: python3 tools/report_device_results.py
      - name: Actual UI preconditions
        if: always()
        run: python3 tools/r25_ui_lab.py --require-observed
      - name: Stage actual R26 native PNG frames
        if: always()
        run: python3 tools/r24c_capture.py stage --frames r26-suite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-native-frames
          path: android/testing/build/r24c/native-frames/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r26-native-results
          path: |
            android/contracts.log
            android/device.log
            android/device-results.json
            android/r25-ui-readiness.json
            android/app/build/outputs/androidTest-results/**
            android/app/build/outputs/managed_device_android_test_additional_output/**
  frames:
    name: Actual frame ${{ matrix.image }} (not all-page acceptance)
    needs: r26
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [r26-art-silver.png, r26-business-light.png, r26-office-workbench.png, r26-hardened-ime.png]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r26-native-frames
          path: android/app/build/outputs/managed_device_android_test_additional_output/transport
      - name: Actual native frame metadata
        run: python3 tools/r24c_capture.py export --frames r26-suite --image "${{ matrix.image }}" --group 0
      - name: Actual native frame chunks 1
        run: python3 tools/r24c_capture.py export --frames r26-suite --image "${{ matrix.image }}" --group 1
      - name: Actual native frame chunks 2
        run: python3 tools/r24c_capture.py export --frames r26-suite --image "${{ matrix.image }}" --group 2
      - name: Actual native frame chunks 3
        run: python3 tools/r24c_capture.py export --frames r26-suite --image "${{ matrix.image }}" --group 3
      - name: Actual native frame chunks 4
        run: python3 tools/r24c_capture.py export --frames r26-suite --image "${{ matrix.image }}" --group 4
      - name: Actual native frame chunks 5
        run: python3 tools/r24c_capture.py export --frames r26-suite --image "${{ matrix.image }}" --group 5
      - name: Actual native frame chunks 6
        run: python3 tools/r24c_capture.py export --frames r26-suite --image "${{ matrix.image }}" --group 6
  verify-frames:
    name: Verify actual transported R26 PNG bytes and target bounds
    needs: frames
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Reject missing, truncated, mismatched or incomplete R26 native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/r24c_capture.py collect --frames r26-suite --run '${{ github.run_id }}' --ci-frames > r26-frame-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-r26-frames
          path: |
            android/r26-frame-receipt.json
            android/testing/build/r24c/captures/**
