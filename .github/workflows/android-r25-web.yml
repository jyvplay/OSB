name: Android R25 actual WebView capability boundary
on:
  push:
    paths: ['android/app/**', 'android/tools/*r25*', '.github/workflows/android-r25-web.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    name: Focused actual platform R25 WebView capabilities (not Office integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Actual compilation platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual controlled renderer and runtime properties
        run: >
          bash tools/run_gradle_ci.sh device :app:pixel6Api34ProDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.fusionDisposable=true
          -Pandroid.experimental.enableAdditionalTestOutput=true
          -Pandroid.testInstrumentationRunnerArguments.class=dev.fusion.shell.R25WebCapabilityDeviceTest
      - name: Actual named outcome
        if: always()
        run: python3 tools/report_device_results.py
      - name: Actual renderer observation, not engine acceptance
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          files=list(Path('app/build/outputs/managed_device_android_test_additional_output').rglob('r25-web-capability.json'))
          if len(files)!=1:raise SystemExit('No unique actual WebView observation; do not infer capability')
          r=json.loads(files[0].read_text())
          assert r['origin']=='android-instrumentation' and r['api']==34 and r['canary']=='R25 native JS 42'
          assert r['office_loaded'] is False and r['complete_browser_accepted'] is False
          r['source_candidate']=os.environ['GITHUB_SHA']
          text=json.dumps(r,separators=(',',':'))
          assert len(text.encode())<3500
          print('::notice::R25WEBVIEW1 '+text)
          Path('r25-web-capability.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r25-actual-webview-capability
          path: |
            android/device.log
            android/device-results.json
            android/r25-web-capability.json
            android/app/build/outputs/androidTest-results/**
            android/app/build/outputs/managed_device_android_test_additional_output/**
