name: Android measured profile experiment
on:
  push:
    paths: ['android/benchmark/**', 'android/baselineprofile/**', 'android/tools/collect_profile_artifact.py', '.github/workflows/android-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measured-profile:
    name: API34 actual profile and benchmark experiment (not physical budgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate actual startup and Files profile
        run: >
          bash tools/run_gradle_ci.sh device :benchmark:pixel6Api34BenchmarkAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=dev.fusion.benchmark.BaselineProfileGenerator
          -Pandroid.testInstrumentationRunnerArguments.fusionDisposable=true
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
          -Pandroid.experimental.enableAdditionalTestOutput=true
      - name: Collect measured rules and rebuild APK
        run: |
          cp device.log profile-generation.log
          cp -r benchmark/build/outputs/androidTest-results profile-generation-results
          python3 tools/collect_profile_artifact.py
          bash tools/run_gradle_ci.sh assemble :app:assembleProBenchmark
          python3 tools/collect_profile_artifact.py --packaged
      - name: Require actual profile compilation and measure real journeys
        run: >
          bash tools/run_gradle_ci.sh device :benchmark:pixel6Api34BenchmarkAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=dev.fusion.benchmark.StartupBenchmark
          -Pandroid.testInstrumentationRunnerArguments.fusionDisposable=true
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
          -Pandroid.experimental.enableAdditionalTestOutput=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-profile-evidence
          path: |
            android/benchmark/build/reports/**
            android/benchmark/build/outputs/**
            android/baselineprofile/src/main/baseline-prof.txt
            android/profile-*.json
            android/profile-generation.log
            android/profile-generation-results/**
            android/device.log
            android/assemble.log
          if-no-files-found: error
