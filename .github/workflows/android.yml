name: Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Assemble + JVM tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle wrapper jar is intentionally not committed, so CI supplies
      # the matching Gradle distribution directly.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run JVM unit tests
        run: >
          gradle --no-daemon
          :core:windowing:test
          :core:index:test
          :core:commands:test
          :core:security:test
          :format:native:test
          :format:ooxml:test
          :format:psd:test
          :cast:dlna:test
          :cast:airplay:test
          :cast:castv2:test
          :feature:together:test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fusion-shell-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/**/build/reports/tests/**
          if-no-files-found: ignore

  instrumented:
    name: Gradle Managed Device (Pixel 6 / API 34)
    runs-on: ubuntu-latest
    # Emulator jobs need nested virtualisation and are slow; run on demand only.
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run managed-device tests
        run: gradle --no-daemon :app:pixel6Api34DebugAndroidTest
