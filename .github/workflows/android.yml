name: Android native
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    name: Traceability, assemble both flavors, JVM tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check source contracts and generated traceability
        run: |
          python3 tools/check_project.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Inspect runner SDK and install pinned platform
        run: |
          SDK_MANAGER="${ANDROID_HOME:?Runner did not expose ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            echo "::error::Runner SDK command-line tools missing; Android compilation has not started."
            exit 1
          fi
          "$SDK_MANAGER" --version
          # Observation only. No automatic toolchain change or SDK37 build pass inferred.
          if python3 tools/probe_android_sdk.py --sdkmanager "$SDK_MANAGER" --report sdk-probe.json; then
            python3 -c 'from pathlib import Path; import json; r=json.loads(Path("sdk-probe.json").read_text()); print("::notice::Real stable/preview SDK catalogs (NOT build/runtime acceptance): "+json.dumps(r))'
          else
            echo "::notice::SDK catalog probe UNKNOWN; no SDK37 availability conclusion."
          fi
          if ! "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;35.0.0' > sdk-setup.log 2>&1; then
            cat sdk-setup.log
            python3 tools/ci_annotations.py sdk-setup.log sdk37-install
            echo "::error::SDK component installation failed before Android compilation. See sdk-setup.log artifact."
            exit 1
          fi
          python3 tools/record_sdk_platform.py --report installed-sdk37.json
          python3 tools/native_lab.py doctor
      - name: Assemble both flavors
        run: bash tools/run_gradle_ci.sh assemble :app:assembleProDebug :app:assemblePlayDebug
      - name: Record actual APK byte sizes and hashes
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          files=sorted(Path('app/build/outputs/apk').glob('*/debug/*.apk'))
          if len(files)!=2: raise SystemExit('Expected exactly two built main debug APKs; no footprint inferred')
          report={'scope':'Actual compressed APK bytes ONLY, NOT installed/RSS/host/Tails comparison',
                  'apks':[{'file':str(p),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]}
          Path('main-apk-footprint.json').write_text(json.dumps(report,indent=2)+'\n')
          print('::notice::Main APK byte observations (NOT total footprint): '+json.dumps(report))
          PY
      - name: Run all JVM unit tests (not device evidence)
        run: >
          bash tools/run_gradle_ci.sh unit-tests --continue
          :core:documents:test :core:windowing:test :core:index:test :core:commands:test
          :core:security:testDebugUnitTest
          :format:native:test :format:archive:test :format:ooxml:test :format:psd:testDebugUnitTest
          :cast:dlna:testDebugUnitTest :cast:airplay:test :cast:castv2:test
          :feature:beam:testDebugUnitTest :feature:together:testDebugUnitTest :testing:test
      - name: Production Kotlin pilot contracts
        run: bash tools/run_gradle_ci.sh contracts :testing:pilotContracts :testing:calculatorContracts :testing:editorContracts :testing:copyContracts :testing:notesContracts :testing:searchAndGateContracts :testing:windowRestoreContracts :testing:encryptedIndexContracts :testing:encodingDiffContracts :testing:ooxmlGuardContracts :testing:browserSessionContracts :testing:noteLinkContracts :testing:noteTrashContracts :testing:noteDraftContracts :testing:subsetContracts :testing:r13Contracts :testing:r14Contracts :testing:r15Contracts :testing:r16Contracts :testing:r17Contracts :testing:r18Contracts :testing:r19Contracts :testing:r20Contracts :testing:r21Contracts :testing:r22Contracts :testing:r23Contracts :testing:r24Contracts
      - name: Lint both manifests and Android sources
        run: bash tools/run_gradle_ci.sh lint :app:lintProDebug :app:lintPlayDebug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: fusion-native-debug
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
      - name: Upload SDK setup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-setup-diagnostics
          path: |
            android/sdk-setup.log
            android/sdk-probe.json
            android/installed-sdk37.json
            android/main-apk-footprint.json
            android/assemble.log
            android/unit-tests.log
            android/contracts.log
            android/lint.log
          if-no-files-found: ignore
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: android/**/build/reports/**
          if-no-files-found: ignore
  instrumented:
    name: API34 managed-device checks (not physical-device spike passes)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install and inspect actual SDK37.0 compilation platform (not runtime37)
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDK_MANAGER" ]]; then SDK_MANAGER="$(command -v sdkmanager)"; fi
          if "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' > sdk37-install.log 2>&1; then
            cat sdk37-install.log
          else
            result=$?;cat sdk37-install.log
            python3 tools/ci_annotations.py sdk37-install.log sdk37-install
            exit "$result"
          fi
          python3 tools/record_sdk_platform.py --report installed-sdk37.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce prior-source child-focus failure on real Android
        run: python3 tools/check_focus_regression.py
      - name: Run pro managed-device tests
        run: bash tools/run_gradle_ci.sh device :app:pixel6Api34ProDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.fusionDisposable=true -Pandroid.testInstrumentationRunnerArguments.notClass=dev.fusion.shell.VisualCaptureTest
      - name: Publish actual device case outcomes
        if: always()
        run: python3 tools/report_device_results.py --mode cases
      - name: Publish bounded actual failure details separately (not hidden by notice cap)
        if: always()
        run: python3 tools/report_device_results.py --mode failures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports
          path: |
            android/app/build/reports/**
            android/device.log
            android/device-results.json
            android/focus-before.log
            android/focus-before-result.json
            android/focus-before-results/**
            android/app/build/outputs/androidTest-results/**
