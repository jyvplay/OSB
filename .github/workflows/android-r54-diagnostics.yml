name: R54 native evidence diagnostics
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Run ID containing the r54-office-evidence artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  cases:
    name: Actual R54 test outcomes and failure details
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r54-office-evidence
          path: android/testing/build/r54/imported-evidence
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
      - name: Enumerate actual test cases, not invented results
        run: python3 tools/report_device_results.py --root testing/build/r54/imported-evidence --mode cases
      - name: Publish bounded individual failure details
        run: python3 tools/report_device_results.py --root testing/build/r54/imported-evidence --mode failures
      - name: Publish bounded emulator and setup diagnostics if present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('testing/build/r54/imported-evidence').rglob('device.log'):
              lines=p.read_text(errors='replace').splitlines()
              matches=[line for line in lines if any(w in line.lower() for w in ('warning:', 'error:', 'failed to install', 'emulator', 'no space', 'exception'))]
              text='\n'.join(matches[-35:]).encode()[-2900:].decode(errors='replace')
              print('::notice::Actual device log excerpts: '+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
  frames:
    name: Actual frame ${{ matrix.image }} (not all-page acceptance)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [r24c-sheet.png, r24c-writer.png]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r54-office-evidence
          path: android/app/build/outputs/managed_device_android_test_additional_output/transport
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
      - name: Native frame metadata
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(0,n,{n})'
      - name: Native frame chunks 1
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(1,n,{n})'
      - name: Native frame chunks 2
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(2,n,{n})'
      - name: Native frame chunks 3
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(3,n,{n})'
      - name: Native frame chunks 4
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(4,n,{n})'
      - name: Native frame chunks 5
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(5,n,{n})'
      - name: Native frame chunks 6
        env:
          IMAGE: ${{ matrix.image }}
        run: python3 -c 'import os,sys; sys.path.insert(0,"tools"); import r24c_capture as c; n=os.environ["IMAGE"]; c.export(6,n,{n})'
