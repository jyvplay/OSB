name: Android Tasks focused diagnostic
on:
  push:
    paths: ['android/app/src/androidTest/java/dev/fusion/shell/R17TaskUiDeviceTest.kt', 'android/app/src/androidTest/java/dev/fusion/shell/R18TaskUiDeviceTest.kt', 'android/app/src/androidTest/java/dev/fusion/shell/R19TaskUiDeviceTest.kt', 'android/feature/automation/**', 'android/app/src/androidTest/java/dev/fusion/shell/TaskUiEvidence.kt', 'android/tools/report_device_results.py', '.github/workflows/android-task-diagnostic.yml']
permissions:
  contents: read
jobs:
  task-ui:
    name: Focused actual Task UI (not full-suite acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe actual Task UI and disk outcome
        run: >
          bash tools/run_gradle_ci.sh device :app:pixel6Api34ProDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.fusionDisposable=true
          -Pandroid.testInstrumentationRunnerArguments.class=dev.fusion.shell.R17TaskUiDeviceTest,dev.fusion.shell.R18TaskUiDeviceTest,dev.fusion.shell.R19TaskUiDeviceTest
      - name: Publish actual outcomes and diagnostics
        if: always()
        run: python3 tools/report_device_results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tasks-focused-device-reports
          path: |
            android/device.log
            android/device-results.json
            android/app/build/outputs/androidTest-results/**
